name: Northstar OpenCode benchmark

on:
  workflow_dispatch:
    inputs:
      model:
        description: OpenCode hosted model ID (keep identical for paired runs)
        required: true
        type: string
        default: opencode/gpt-5.3-codex

permissions:
  contents: read

concurrency:
  group: northstar-opencode-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: OpenCode baseline and PWDS pair
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      MODEL: ${{ inputs.model }}
      RUN_ROOT: ${{ runner.temp }}/northstar-opencode-runs

    steps:
      - name: Check out PWDS benchmark materials
        uses: actions/checkout@v4

      - name: Validate provider secret and selected model
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${OPENCODE_API_KEY:-}" ]]; then
            echo "::error::Missing repository secret OPENCODE_API_KEY. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "::add-mask::$OPENCODE_API_KEY"
          if [[ ! "$MODEL" =~ ^opencode/[a-zA-Z0-9._-]+$ ]]; then
            echo "::error::Model must use the opencode/<model-id> format."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate PWDS skill pack
        run: node scripts/validate-skills.mjs

      - name: Install OpenCode CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @opencode/cli
          opencode --version
          node --version

      - name: Run isolated baseline and PWDS conditions
        shell: bash
        env:
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUN_ROOT"

          run_condition() {
            local condition="$1"
            local run_dir="$RUN_ROOT/$condition"
            local prompt_file="$run_dir/prompt.md"
            local start_epoch start_utc end_epoch end_utc elapsed status cli_version

            mkdir -p "$run_dir"
            cp "$GITHUB_WORKSPACE/evaluations/2026-11-premium-saas/${condition}-prompt.md" "$prompt_file"
            cli_version="$(opencode --version)"
            start_epoch="$(date +%s)"
            start_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

            cat > "$run_dir/run-metadata.md" <<EOF
          # OpenCode benchmark run: $condition

          - Agent: OpenCode CLI
          - Provider: OpenCode hosted provider (Zen / Console)
          - Model: $MODEL
          - OpenCode version: $cli_version
          - Condition: $condition
          - Started (UTC): $start_utc
          - Active build-time limit: 45 minutes
          - Workspace: isolated GitHub Actions temporary directory
          EOF

            echo "::group::OpenCode $condition — $MODEL"
            set +e
            (cd "$run_dir" && timeout --signal=TERM --kill-after=60s 45m opencode run --standalone --model "$MODEL" --agent build --auto "$(cat "$prompt_file")") 2>&1 | tee "$run_dir/opencode.log"
            status=$?
            set -e
            echo "::endgroup::"

            end_epoch="$(date +%s)"
            end_utc="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            elapsed="$((end_epoch - start_epoch))"
            {
              echo "- Finished (UTC): $end_utc"
              echo "- Elapsed seconds: $elapsed"
              echo "- Exit code: $status"
              echo "- Result: $([[ "$status" -eq 0 ]] && echo completed || echo blocked/failed)"
            } >> "$run_dir/run-metadata.md"

            # Do not preserve a provider credential in downloadable logs.
            node -e 'const fs=require("node:fs"); const p=process.argv[1]; const key=process.env.OPENCODE_API_KEY; if(key){ const s=fs.readFileSync(p,"utf8"); fs.writeFileSync(p,s.split(key).join("[REDACTED]")); }' "$run_dir/opencode.log"
            return "$status"
          }

          # The baseline workspace is intentionally isolated and receives no PWDS files.
          run_condition baseline

          # Install the skill pack only after baseline has completed, in a separate workspace.
          PWDS_DIR="$RUN_ROOT/pwds"
          mkdir -p "$PWDS_DIR"
          cp -R "$GITHUB_WORKSPACE/profiles" "$PWDS_DIR/profiles"
          cp -R "$GITHUB_WORKSPACE/references" "$PWDS_DIR/references"
          cp "$GITHUB_WORKSPACE/benchmarks/premium-saas.md" "$PWDS_DIR/benchmark-brief.md"
          (
            cd "$PWDS_DIR"
            node "$GITHUB_WORKSPACE/scripts/install.mjs" --agent universal --scope project
          )
          run_condition pwds

      - name: Upload run workspaces, prompts, logs, and metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: northstar-opencode-${{ github.run_id }}
          path: ${{ runner.temp }}/northstar-opencode-runs
          if-no-files-found: warn
          retention-days: 30
