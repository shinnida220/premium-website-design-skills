<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Responsive transformation reference</title><desc id="desc">Desktop three-column content reorganizes into a single-column mobile flow with navigation condensed and content priority retained.</desc>
<rect width="1200" height="620" rx="24" fill="#f5f3ee"/><text x="64" y="70" font-family="Arial" font-size="16" letter-spacing="3" fill="#555">RESPONSIVE RECOMPOSITION</text>
<text x="90" y="126" font-family="Arial" font-size="20" fill="#222">Desktop / wide</text><rect x="80" y="150" width="650" height="390" rx="16" fill="#fff" stroke="#ccc"/><rect x="104" y="174" width="602" height="48" rx="8" fill="#ded8cd"/><rect x="104" y="246" width="370" height="120" rx="8" fill="#cbd8ce"/><rect x="490" y="246" width="216" height="120" rx="8" fill="#e8e2d8"/><rect x="104" y="384" width="184" height="132" rx="8" fill="#e8e2d8"/><rect x="302" y="384" width="184" height="132" rx="8" fill="#e8e2d8"/><rect x="500" y="384" width="206" height="132" rx="8" fill="#e8e2d8"/>
<text x="820" y="126" font-family="Arial" font-size="20" fill="#222">Mobile / narrow</text><rect x="820" y="150" width="280" height="390" rx="24" fill="#fff" stroke="#aaa" stroke-width="3"/><rect x="842" y="174" width="236" height="40" rx="8" fill="#ded8cd"/><rect x="842" y="230" width="236" height="110" rx="8" fill="#cbd8ce"/><rect x="842" y="354" width="236" height="72" rx="8" fill="#e8e2d8"/><rect x="842" y="440" width="236" height="72" rx="8" fill="#e8e2d8"/>
<g font-family="Arial" font-size="14" fill="#555"><text x="80" y="578">Preserve task priority; reflow columns, simplify navigation, and maintain readable spacing.</text></g></svg>