<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Interaction state reference</title><desc id="desc">Button examples for default, hover, keyboard focus, pressed, disabled, and error states.</desc>
<rect width="1200" height="520" rx="24" fill="#f6f4ef"/><text x="64" y="72" font-family="Arial" font-size="16" letter-spacing="3" fill="#555">INTERACTION STATES</text>
<g font-family="Arial" font-size="14" fill="#555"><text x="120" y="150">DEFAULT</text><text x="310" y="150">HOVER</text><text x="500" y="150">KEYBOARD FOCUS</text><text x="720" y="150">PRESSED</text><text x="900" y="150">DISABLED</text><text x="1060" y="150">ERROR</text></g>
<g><rect x="90" y="180" width="150" height="56" rx="12" fill="#252525"/><rect x="280" y="180" width="150" height="56" rx="12" fill="#4b6556"/><rect x="470" y="174" width="162" height="68" rx="16" fill="none" stroke="#4b6556" stroke-width="4"/><rect x="476" y="180" width="150" height="56" rx="12" fill="#252525"/><rect x="690" y="180" width="150" height="56" rx="12" fill="#151515"/><rect x="880" y="180" width="150" height="56" rx="12" fill="#d8d5cf"/><rect x="1050" y="180" width="120" height="56" rx="12" fill="#a94442"/></g>
<g font-family="Arial" font-size="16" fill="#fff" text-anchor="middle"><text x="165" y="214">Continue</text><text x="355" y="214">Continue</text><text x="551" y="214">Continue</text><text x="765" y="214">Continue</text><text x="955" y="214" fill="#777">Continue</text><text x="1110" y="214">Retry</text></g>
<g font-family="Arial" font-size="14" fill="#555"><text x="90" y="286">Resting appearance</text><text x="280" y="286">Pointer feedback</text><text x="470" y="286">Visible focus ring</text><text x="690" y="286">Activation feedback</text><text x="880" y="286">Unavailable + explained</text><text x="1050" y="286">Recovery path</text></g>
<rect x="90" y="340" width="1080" height="92" rx="12" fill="#fff" stroke="#ddd"/><text x="120" y="378" font-family="Arial" font-size="18" fill="#222">State design is part of the component, not an afterthought.</text><text x="120" y="406" font-family="Arial" font-size="14" fill="#666">Also define loading, success, validation, empty, and destructive confirmation states where relevant.</text></svg>